# Tier A — grow a single target image from one seed, and regenerate it after damage.
# One YAML file + git commit + seed fully reproduces a run (see docs/DESIGN.md §8).
seed: 42
device: auto # auto | cpu | cuda

model:
  channels: 16 # 4 RGBA + 12 hidden scratch channels
  hidden: 128 # width of the update MLP
  fire_rate: 0.5 # probability a cell updates on a given step
  alive_threshold: 0.1 # min neighbour-alpha for a cell to stay alive

data:
  target: heart # builtin procedural target (no external assets / licenses)
  size: 40 # target is 40x40 ...
  pad: 16 # ... padded to a 72x72 grid so it has room to grow

train:
  steps: 8000
  batch_size: 8
  lr: 0.002
  step_range: [64, 96] # random NCA steps per forward pass
  pool_size: 1024 # persistence: pool of past end-states to resume from
  damage: true # zero random patches so the model learns to regenerate
  precision: bf16 # bf16 autocast on CUDA; fp32 on CPU
