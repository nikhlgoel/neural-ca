[project]
name = "neural-ca"
version = "0.1.0"
description = "Neural Cellular Automata from scratch: tiny models where every cell runs one shared, learned, local rule — growing, self-repairing, and segmenting images. A fully documented research project."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
    # Display name = GitHub identity; change to your full name if you prefer.
    { name = "nikhlgoel", email = "goelnikhil.com@gmail.com" },
]
requires-python = ">=3.12"
dependencies = [
    "torch>=2.7",
    "numpy>=2.0",
    "einops>=0.8",
    "pyyaml>=6.0",
    "pydantic>=2.7",
    "tqdm>=4.66",
    "tensorboard>=2.16",
    "matplotlib>=3.9",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
    "pre-commit>=4.0",
    "onnxruntime>=1.27.0",
    "onnx>=1.22.0",
    "onnxscript>=0.7.1",
]

# ── PyTorch wheel selection ─────────────────────────────────────────────
# Windows (dev machine, RTX 3050): CUDA 12.8 wheels.
# Linux (CI): CPU wheels — small and fast to install.
# Other platforms fall back to PyPI defaults.
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'win32'" },
    { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/neural_ca"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
extend-select = [
    "I",   # isort — deterministic import order
    "UP",  # pyupgrade — modern Python syntax
    "B",   # bugbear — likely bugs
    "SIM", # simplify
    "RUF", # ruff-specific rules
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
